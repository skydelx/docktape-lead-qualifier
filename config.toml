# Everything a sales lead would want to tune lives here, not in the code.

tracker_path = "leads.xlsx"

[llm]
model = "claude-opus-5-5"
effort = "medium"
max_agent_steps = 6    # API requests one agent may use before the lead goes to a person
max_web_searches = 3

# --- Do-not-engage list (fictional, from the exercise brief) -----------------
# The domains are made up too; `.test` can never resolve to a real company.

[[competitors]]
name = "CloudTrim Inc"
domains = ["cloudtrim.test"]

[[competitors]]
name = "SpendWise Cloud"
domains = ["spendwisecloud.test"]

[[competitors]]
name = "RightSize Cloud Co"
domains = ["rightsizecloud.test"]

# --- Sanctions / export-control screening ------------------------------------
# A simplified, dated prototype policy (2026-10) for a service provider based in
# the EU. Only where the company is headquartered counts. Not legal advice.

[[sanctions]]
place = "Russia"
aliases = ["Russian Federation"]
level = "blocked"
reason = "EU sanctions prohibit providing IT consultancy services to companies established in Russia."

[[sanctions]]
place = "Crimea / occupied regions of Ukraine"
aliases = ["Crimea", "Sevastopol", "Simferopol", "Donetsk", "Luhansk", "Kherson", "Zaporizhzhia"]
level = "blocked"
reason = "EU and US sanctions prohibit services to companies in the occupied regions of Ukraine."

[[sanctions]]
place = "Iran"
aliases = ["Islamic Republic of Iran"]
level = "blocked"
reason = "Iran is under broad EU and US sanctions; we do not engage."

[[sanctions]]
place = "North Korea"
aliases = ["DPRK", "Democratic People's Republic of Korea"]
level = "blocked"
reason = "North Korea is under the most restrictive EU and US sanctions; we do not engage."

[[sanctions]]
place = "Belarus"
aliases = []
level = "review"
reason = "EU restrictions target the Belarusian state and its bodies, not every private company; a person should check."

[[sanctions]]
place = "Cuba"
aliases = []
level = "review"
reason = "Under a US embargo but not an EU one; a person should check before engaging."

[[sanctions]]
place = "Syria"
aliases = []
level = "review"
reason = "Most sanctions were lifted in 2025, but targeted ones remain; a person should check."

[[sanctions]]
place = "Venezuela"
aliases = []
level = "review"
reason = "Targeted sanctions against listed persons and entities; a person should check."

[[sanctions]]
place = "Myanmar"
aliases = ["Burma"]
level = "review"
reason = "Targeted sanctions against listed persons and entities; a person should check."

# --- Fit score -----------------------------------------------------------------
# Two axes of 0-50 (company size, cloud spend signal) plus small bonuses.
# The numbers are our assumptions; the README explains each of them.

[scoring]
unknown_axis_points = 25
bonus_points = 5
max_bonus = 10
sales_ready_min = 65
review_min = 40
preferred_providers = ["aws", "oracle"]
decision_maker_keywords = ["cto", "ceo", "cfo", "founder", "owner", "chief", "vp", "head of", "director"]

[scoring.size_points]
"1-10" = 15
"11-50" = 40
"51-1000" = 50
"1001-5000" = 35
"5000+" = 25

# Self-reported monthly cloud bill.
[scoring.spend_points]
"<5k" = 10
"5k-20k" = 35
">20k" = 50

# Used only when the lead did not report a bill: workload inferred from research.
[scoring.workload_points]
low = 5
medium = 25
high = 40
