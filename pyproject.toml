[project]
name = "leadqual"
version = "0.1.0"
description = "Lead qualification prototype: research, compliance screening, fit score, tracker, notification."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
leadqual = "leadqual.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadqual"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
